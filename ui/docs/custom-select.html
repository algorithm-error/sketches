<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Select – UI Kit</title>
        <link rel="stylesheet" href="docs.css" />
        <script type="module" src="../custom-theme.js"></script>
        <script type="module" src="../custom-select.js"></script>
        <script type="module" src="./code-snippet.js"></script>
        <script type="module" src="./docs-sidebar.js"></script>
    </head>
    <body>
        <custom-theme>
            <aside>
                <docs-sidebar current="custom-select"></docs-sidebar>
            </aside>
            <main>
                <h1>Select</h1>
                <p>
                    A native <code>&lt;select&gt;</code>, restyled to match the kit. Options are authored as plain
                    <code>&lt;option&gt;</code> children and forwarded through a slot. Dispatches
                    <code>change</code> with <code>detail.value</code>.
                </p>

                <section aria-label="Basic">
                    <h2>Basic</h2>
                    <div>
                        <custom-select id="demo-select" value="b">
                            <option value="a">Attractor</option>
                            <option value="b">Emitter</option>
                            <option value="c">Repeller</option>
                        </custom-select>
                        <p id="demo-select-output">Value: b</p>
                    </div>
                    <code-snippet></code-snippet>
                </section>

                <section aria-label="Small">
                    <h2>Small</h2>
                    <p>Select size small</p>
                    <div>
                        <custom-select size="small">
                            <option value="black">Black</option>
                            <option value="red">Red</option>
                            <option value="cyan">Cyan</option>
                        </custom-select>
                    </div>
                    <code-snippet></code-snippet>
                </section>

                <section aria-label="Disabled">
                    <h2>Disabled</h2>
                    <div>
                        <custom-select disabled>
                            <option value="a">Locked</option>
                        </custom-select>
                    </div>
                    <code-snippet></code-snippet>
                </section>
            </main>
        </custom-theme>

        <script type="module">
            const select = document.getElementById('demo-select');
            const output = document.getElementById('demo-select-output');
            select.addEventListener('change', (event) => {
                output.textContent = `Value: ${event.detail.value}`;
            });
        </script>
    </body>
</html>
