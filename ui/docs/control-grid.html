<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Control grid – UI Kit</title>
        <meta
            property="og:description"
            content="Customizable computational graphics printed with pen on paper, UI kit for P5 sketches and articles."
        />
        <meta
            property="og:image"
            content="https://gallery.algorithmerror.tech/gallery/thumbnails/worley-curls-source-medium.jpg"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="stylesheet" href="docs.css" />
        <script type="module" src="../control-theme.js"></script>
        <script type="module" src="../control-grid.js"></script>
        <script type="module" src="../control-button.js"></script>
        <script type="module" src="./code-snippet.js"></script>
        <script type="module" src="./docs-sidebar.js"></script>
    </head>
    <body>
        <control-theme>
            <aside>
                <docs-sidebar current="control-grid"></docs-sidebar>
            </aside>
            <main>
                <h1>Control grid</h1>
                <p>
                    A plain layout wrapper: <code>display: flex; flex-direction: column; gap: 1.75rem;</code>. Like
                    <code>control-column</code>, but with a wider gap — used to lay out a full panel's worth of controls
                    (see the <a href="control-panel.html">Panel</a> demo).
                </p>

                <section aria-label="Basic">
                    <h2>Basic</h2>
                    <p>Children are stacked in a column with a 1.75rem gap between them.</p>
                    <div style="max-width: 12rem">
                        <control-grid>
                            <control-button>One</control-button>
                            <control-button>Two</control-button>
                            <control-button>Three</control-button>
                        </control-grid>
                    </div>
                    <code-snippet></code-snippet>
                </section>
            </main>
        </control-theme>
    </body>
</html>
