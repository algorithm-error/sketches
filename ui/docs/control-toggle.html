<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Toggle – UI Kit</title>
        <meta
            property="og:description"
            content="Customizable computational graphics printed with pen on paper, UI kit for P5 sketches and articles."
        />
        <meta
            property="og:image"
            content="https://gallery.algorithmerror.tech/gallery/thumbnails/worley-curls-source-medium.jpg"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="stylesheet" href="docs.css" />
        <script type="module" src="../control-theme.js"></script>
        <script type="module" src="../control-toggle.js"></script>
        <script type="module" src="./code-snippet.js"></script>
        <script type="module" src="./docs-sidebar.js"></script>
    </head>
    <body>
        <control-theme>
            <aside>
                <docs-sidebar current="control-toggle"></docs-sidebar>
            </aside>
            <main>
                <h1>Toggle</h1>
                <p>
                    A boolean switch with the same <code>checked</code>/<code>disabled</code> API as a native checkbox,
                    built on a <a href="control-slider.html">slider</a>-style track with a sliding thumb instead of a
                    checkmark.
                </p>

                <section aria-label="Basic">
                    <h2>Basic</h2>
                    <p>Dispatches <code>change</code> with <code>detail.checked</code>.</p>
                    <div>
                        <control-toggle id="demo-toggle" checked></control-toggle>
                        <p id="demo-toggle-output">Checked: true</p>
                    </div>
                    <code-snippet></code-snippet>
                </section>

                <section aria-label="Disabled">
                    <h2>Disabled</h2>
                    <div>
                        <control-toggle disabled></control-toggle>
                        <control-toggle checked disabled></control-toggle>
                    </div>
                    <code-snippet></code-snippet>
                </section>
            </main>
        </control-theme>

        <script type="module">
            const toggle = document.getElementById('demo-toggle');
            const output = document.getElementById('demo-toggle-output');
            toggle.addEventListener('change', (event) => {
                output.textContent = `Checked: ${event.detail.checked}`;
            });
        </script>
    </body>
</html>
