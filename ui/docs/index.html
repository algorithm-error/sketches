<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>UI Kit</title>
        <link rel="stylesheet" href="../../base.css" />
        <style>
            /*
             * Index of the UI kit: a masonry of live panels lifted from real
             * sketches.
             */
            body {
                padding-top: var(--page-top-padding);
            }

            /* Same width as the website's pages: full width, 2rem clear of the edges. */
            main {
                color: var(--color);
                font-family: var(--font-family);
                box-sizing: border-box;
                padding: 0 2rem;
            }

            main > header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
            }

            /* Columns as wide as a panel, the rest of the room split between them, so
               the outer panels sit at the padding and the middle ones land evenly. */
            .masonry {
                --panel-width: calc(21 * var(--font-size));
                --masonry-columns: 1;
                position: relative;
                box-sizing: border-box;
                padding: 1rem;
                column-count: var(--masonry-columns);
                column-gap: calc((100% - var(--masonry-columns) * var(--panel-width)) / (var(--masonry-columns) - 1));
                margin-top: 2rem;
            }

            /* One column has no gap to spread, so the panel is centred instead. */
            @media (max-width: 749px) {
                .masonry control-panel {
                    margin-inline: auto;
                }
            }

            @media (min-width: 750px) {
                .masonry {
                    --masonry-columns: 2;
                }
            }

            @media (min-width: 1200px) {
                .masonry {
                    --masonry-columns: 3;
                }
            }

            .masonry > article {
                break-inside: avoid;
                margin-bottom: 1.5rem;
            }

            .masonry figure {
                margin: 0;
            }

            /* Panels float over a canvas on a sketch page; here they sit in the flow. */
            .masonry control-panel {
                position: static;
                max-width: 100%;
                box-sizing: border-box;
            }

            /* Scrolls with the panels, so they stay put against it. */
            .background {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
                z-index: -1;
                pointer-events: none;
            }
        </style>
        <script type="module" src="../index.js"></script>
    </head>
    <body>
        <custom-theme id="theme">
            <!-- Copy of the nav in the website project's Header.astro; keep in sync. -->
            <header class="site-nav">
                <nav>
                    <a href="/">Plots</a>
                    <a href="/art">Art</a>
                    <a href="/articles">Articles</a>
                    <span aria-current="page">UI kit</span>
                </nav>
            </header>
            <main>
                <p class="lede">
                    Bare html meets CGA. Web components for driving generative sketches: buttons, sliders, pads and a
                    panel.
                </p>

                <div class="masonry">
                    <iframe
                        class="background"
                        src="../../mesh/offset-mesh.html"
                        tabindex="-1"
                        aria-hidden="true"
                    ></iframe>
                    <article>
                        <figure>
                            <control-panel title="Flow field" class="emboss">
                                <compound-seed value="1772133851191"></compound-seed>
                                <compound-slider
                                    label="Noise increment"
                                    help="Step size between sampled noise points; higher is coarser"
                                    min="0.001"
                                    max="0.05"
                                    step="0.001"
                                    value="0.009"
                                    decimals="3"
                                ></compound-slider>
                                <compound-slider
                                    label="LOD"
                                    help="Number of octaves of noise detail"
                                    min="1"
                                    max="10"
                                    step="1"
                                    value="4"
                                    decimals="0"
                                ></compound-slider>
                                <compound-slider
                                    label="Falloff"
                                    help="Amplitude falloff per noise octave"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                    value="0.5"
                                    decimals="2"
                                ></compound-slider>
                            </control-panel>
                        </figure>
                    </article>
                    <article>
                        <figure>
                            <control-panel fixed title="Skin fire" class="emboss">
                                <control-row>
                                    <play-stop-button stretch playing></play-stop-button>
                                    <labeled-numeric-input
                                        label="Frame"
                                        value="28"
                                        min="0"
                                        max="2000"
                                        step="1"
                                        decimals="0"
                                        disabled
                                    ></labeled-numeric-input>
                                </control-row>
                                <custom-fieldset label="Paper and brush size">
                                    <labeled-select label="Paper preset">
                                        <option value="A1">A1</option>
                                        <option value="A2">A2</option>
                                        <option value="A3">A3</option>
                                        <option value="A4">A4</option>
                                        <option value="ARCH_C">Arch C</option>
                                        <option value="ARCH_D">Arch D</option>
                                    </labeled-select>
                                    <labeled-select label="Brush preset">
                                        <option value="digital">Digital</option>
                                        <option value="brush">Copic brush nib</option>
                                        <option value="fine">Copic fine nib</option>
                                    </labeled-select>
                                    <control-row style="--columns: 3 2">
                                        <size-input
                                            width="594"
                                            height="841"
                                            min="10"
                                            max="2000"
                                            step="1"
                                            stretch
                                            disabled
                                        ></size-input>
                                        <labeled-numeric-input
                                            label="Cell"
                                            value="2"
                                            min="0.5"
                                            max="20"
                                            step="0.1"
                                            decimals="2"
                                        ></labeled-numeric-input>
                                    </control-row>
                                </custom-fieldset>
                            </control-panel>
                        </figure>
                    </article>
                    <article>
                        <figure>
                            <control-panel title="Attractors" class="emboss" placement="right">
                                <custom-fieldset label="Attractor 1">
                                    <vector-slider
                                        label="Velocity"
                                        help="Velocity vectors on canvas are scaled ×50 for visibility"
                                        mode="polar"
                                        min="-1"
                                        max="1"
                                        step="0.01"
                                        decimals="2"
                                        x="0.55"
                                        y="-0.55"
                                        style="--fill: var(--red)"
                                    ></vector-slider>
                                    <labeled-input label="Position">
                                        <coordinate-input
                                            size="small"
                                            min="-2000"
                                            max="2000"
                                            step="1"
                                            decimals="1"
                                            x="-40"
                                            y="0"
                                            stretch
                                        ></coordinate-input>
                                    </labeled-input>
                                    <compound-slider
                                        label="Mass"
                                        help="Pulls harder and moves less"
                                        min="1"
                                        max="50"
                                        step="1"
                                        decimals="0"
                                        value="10"
                                    ></compound-slider>
                                </custom-fieldset>
                            </control-panel>
                        </figure>
                    </article>
                    <article>
                        <figure>
                            <control-panel fixed title="Attractor traces" class="emboss">
                                <control-row>
                                    <labeled-select label="Style" value="script" stretch>
                                        <option value="default">None</option>
                                        <option value="script">Script</option>
                                        <option value="barb">Barb</option>
                                        <option value="spring">Spring</option>
                                        <option value="rosette">Rosette</option>
                                    </labeled-select>
                                    <random-seed-button stretch>Random</random-seed-button>
                                </control-row>
                                <labeled-input label="Origins" help="Align to grid or to Collatz mesh">
                                    <labeled-radio-group value="mesh" style="--direction: row">
                                        <option value="grid">Grid</option>
                                        <option value="mesh">Mesh</option>
                                    </labeled-radio-group>
                                </labeled-input>
                                <compound-range-slider
                                    label="Overshoot"
                                    help="Larger values give more chaos"
                                    min="0"
                                    max="0.7"
                                    step="0.05"
                                    decimals="2"
                                    from="0.2"
                                    to="0.5"
                                ></compound-range-slider>
                            </control-panel>
                        </figure>
                    </article>
                    <article>
                        <figure>
                            <control-panel title="Collatz mesh" class="emboss" placement="right">
                                <labeled-input label="Render conjecture as">
                                    <binary-toggle value="mesh">
                                        <span slot="mesh">Mesh</span>
                                        <span slot="tree">Tree</span>
                                    </binary-toggle>
                                </labeled-input>
                                <vector-slider
                                    label="Origin"
                                    help="Where every sequence meets, as a fraction of the canvas"
                                    point
                                    style="--ratio: 1"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                    x="0.5"
                                    y="0.5"
                                    decimals="2"
                                ></vector-slider>
                                <control-row>
                                    <compound-angle-slider
                                        label="Odd angle"
                                        help="At odd numbers"
                                        min="4.5"
                                        max="90"
                                        step="0.5"
                                        decimals="1"
                                        value="40"
                                        style="--fill: red"
                                    ></compound-angle-slider>
                                    <compound-angle-slider
                                        label="Even angle"
                                        help="At even numbers"
                                        min="4.5"
                                        max="90"
                                        step="0.5"
                                        decimals="1"
                                        value="45"
                                    ></compound-angle-slider>
                                </control-row>
                            </control-panel>
                        </figure>
                    </article>

                    <article>
                        <figure>
                            <control-panel fixed title="Actions" class="emboss">
                                <labeled-input
                                    label="Optimized"
                                    help="Drop curves that duplicate the start of a longer one"
                                >
                                    <custom-toggle checked></custom-toggle>
                                </labeled-input>
                                <control-row>
                                    <custom-button stretch variant="accent">Save SVG</custom-button>
                                    <custom-button stretch variant="outline">Reset</custom-button>
                                </control-row>
                                <control-row>
                                    <acknowledge-button stretch variant="black"
                                        >Copy call<span slot="confirm">Copied</span></acknowledge-button
                                    >
                                    <acknowledge-button stretch variant="yellow"
                                        >Copy JSON<span slot="confirm">Copied</span></acknowledge-button
                                    >
                                </control-row>
                                <apply-button stretch disabled variant="transparent">Changes applied live</apply-button>
                            </control-panel>
                        </figure>
                    </article>
                </div>
            </main>
            <!-- Copy of the website project's Footer.astro; keep in sync. -->
            <footer class="site-footer">
                <p>
                    &copy;
                    <script>
                        document.currentScript.replaceWith(new Date().getFullYear());
                    </script>
                    Algorithm Error
                </p>
            </footer>
        </custom-theme>
    </body>
</html>
