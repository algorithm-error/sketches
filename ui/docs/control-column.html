<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Control column – UI Kit</title>
        <link rel="stylesheet" href="docs.css" />
        <script type="module" src="../custom-theme.js"></script>
        <script type="module" src="../control-column.js"></script>
        <script type="module" src="../custom-button.js"></script>
        <script type="module" src="./code-snippet.js"></script>
        <script type="module" src="./docs-sidebar.js"></script>
    </head>
    <body>
        <custom-theme>
            <aside>
                <docs-sidebar current="control-column"></docs-sidebar>
            </aside>
            <main>
                <h1>Control column</h1>
                <p>
                    A plain layout wrapper: <code>display: flex; flex-direction: column; gap: 1.5rem;</code>. No JS
                    behavior, just spacing for whatever's dropped inside it.
                </p>

                <section aria-label="Basic">
                    <h2>Basic</h2>
                    <p>Children are stacked in a column with an even gap between them.</p>
                    <div style="max-width: 12rem">
                        <control-column>
                            <custom-button>One</custom-button>
                            <custom-button>Two</custom-button>
                            <custom-button>Three</custom-button>
                        </control-column>
                    </div>
                    <code-snippet></code-snippet>
                </section>
            </main>
        </custom-theme>
    </body>
</html>
